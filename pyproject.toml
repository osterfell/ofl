[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ofl"
version = "0.6.2"
description = "Command line client and Python library for the Osterfell GPU cloud"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://osterfell.com"
Source = "https://github.com/osterfell/ofl"

[project.scripts]
ofl = "ofl.cli:main"

[tool.setuptools]
packages = ["ofl"]
